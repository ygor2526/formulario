<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario - Inscrição</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Academia de Herois</h1>
    <p>Inscreva-se para participar da nossa proxima missão.</p>
  </header>

  <section>
    <h2>Faça sua inscrição</h2>
    <form action="#" method="get">
      
      <label for="nome">Nome de heroi</label>
      <input id="nome" name="nome" type="text" required />

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required />

      <label for="idade">Idade</label>
      <input id="idade" name="idade" type="number" required />

      <label for="periodo">Escolha sua equipe:</label>
      <select id="periodo" name="periodo">
        <option value="" disabled selected>Escolha uma equipe</option>
        <option value="manha">Liga da justiça</option>
        <option value="tarde">Vingadores</option>
        <option value="noite">X-men</option>
      </select>

      <fieldset class="grupo-radio">
        <H2>Qual poder vc prefere?</H2>

         <p class="grupo-checkbox">
        <input type="radio" id="nao" name="criou_html" value="nao" />
        <label for="nao" class="label-inline">Voar</label>
        </p>

           <p class="grupo-checkbox">
        <input type="radio" id="nao" name="criou_html" value="nao" />
        <label for="nao" class="label-inline">SuperVelocidade</label>
        </p>
        
         <p class="grupo-checkbox">
        <input type="radio" id="nao" name="criou_html" value="nao" />
        <label for="nao" class="label-inline">Superforça</label>
        </p>

         <p class="grupo-checkbox">
        <input type="radio" id="nao" name="criou_html" value="nao" />
        <label for="nao" class="label-inline">Quero receber novas missões.</label>
        </p>
        

      <label for="expectativa">Por que vc quer ser um heroi?</label>
      <textarea id="expectativa" name="expectativa" rows="4"></textarea>

      <button type="submit">Enviar inscrição</button>

    </form>
  </section>

  <footer>
    <p> prática de formulários HTML.</p>
  </footer>

</body>
</html>
